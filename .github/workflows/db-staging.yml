# Aplica as migrations novas no banco de STAGING sempre que a branch `staging` recebe uma mudança em supabase/migrations
# (ou ao rodar à mão: Actions → "Banco de staging" → Run workflow).
# Conecta direto no banco pela senha (pooler do Supabase): NÃO usa token da conta Supabase.
# Segredos (GitHub → Settings → Secrets and variables → Actions):
#   STAGING_PROJECT_REF   referência (20 letras) do projeto Supabase de STAGING
#   STAGING_DB_PASSWORD   senha do banco do projeto de STAGING
name: Banco de staging

on:
  push:
    branches: [staging]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency: db-staging

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrations novas
        env:
          REF: ${{ secrets.STAGING_PROJECT_REF }}
          PW: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          ENC=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["PW"],safe=""))')
          echo "::add-mask::$ENC"
          supabase db push --db-url "postgresql://postgres.${REF}:${ENC}@aws-0-us-east-1.pooler.supabase.com:5432/postgres" --yes
