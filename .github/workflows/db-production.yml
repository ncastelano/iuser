# Aplica migrations no banco de PRODUÇÃO. Só roda quando alguém dispara à mão E aprova.
#   1) GitHub → Actions → "Banco de produção" → Run workflow (escolha a branch/ref; normalmente `staging` já testada)
#   2) o ambiente `db-production` exige aprovação de um revisor (Settings → Environments → db-production → Required reviewers)
# Antes de aplicar, o job confere que TODAS as migrations novas já passaram pelo staging (mesmo ref). Ele mostra a lista
# do que vai ser aplicado ANTES de aplicar (dry-run).
# Segredos (no ambiente `db-production`): SUPABASE_ACCESS_TOKEN, PRODUCTION_PROJECT_REF, PRODUCTION_DB_PASSWORD,
# e para a checagem do staging: STAGING_PROJECT_REF, STAGING_DB_PASSWORD.
name: Banco de produção

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite APLICAR para confirmar que quer mexer no banco de PRODUÇÃO'
        required: true

concurrency: db-production

jobs:
  migrate:
    if: inputs.confirm == 'APLICAR'
    runs-on: ubuntu-latest
    environment: db-production      # <- exige aprovação manual de um revisor
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Linkar o projeto de PRODUÇÃO
        run: supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      - name: O que vai ser aplicado (dry-run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      - name: Conferir que o staging já tem essas migrations
        run: |
          supabase migration list --linked > prod.txt
          supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
          supabase migration list --linked > staging.txt
          # versões pendentes na produção (coluna LOCAL preenchida, REMOTE vazia)
          awk -F'|' 'NF>=2 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {gsub(/ /,"",$1); print $1}' prod.txt > pending.txt || true
          while read v; do
            [ -z "$v" ] && continue
            if ! grep -qE "^[[:space:]]*$v[[:space:]]*\|[[:space:]]*$v" staging.txt; then
              echo "A migration $v ainda NÃO foi aplicada no staging. Teste no staging primeiro."; exit 1
            fi
          done < pending.txt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      - name: Relinkar PRODUÇÃO e aplicar
        run: |
          supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
