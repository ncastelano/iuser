# Aplica migrations no banco de PRODUÇÃO. Só roda quando alguém dispara à mão E aprova.
#   1) GitHub → Actions → "Banco de produção" → Run workflow (branch `main`, com a migration já mesclada)
#   2) o ambiente `db-production` exige aprovação de um revisor (Settings → Environments → db-production → Required reviewers)
# Antes de aplicar, o job confere que TODAS as migrations novas já passaram pelo staging. Mostra o que vai ser aplicado
# (dry-run) ANTES de aplicar. Conecta direto no banco pela senha (pooler do Supabase): NÃO usa token da conta Supabase.
# Segredos: no ambiente `db-production`: PRODUCTION_PROJECT_REF, PRODUCTION_DB_PASSWORD; no repositório: STAGING_PROJECT_REF, STAGING_DB_PASSWORD.
name: Banco de produção

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite APLICAR para confirmar que quer mexer no banco de PRODUÇÃO'
        required: true

concurrency: db-production

jobs:
  migrate:
    if: inputs.confirm == 'APLICAR'
    runs-on: ubuntu-latest
    environment: db-production      # <- exige aprovação manual de um revisor
    env:
      PROD_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      PROD_PW: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      STG_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STG_PW: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Montar as conexões (senhas codificadas e mascaradas)
        run: |
          enc() { python3 -c 'import os,sys,urllib.parse;print(urllib.parse.quote(os.environ[sys.argv[1]],safe=""))' "$1"; }
          P=$(enc PROD_PW); S=$(enc STG_PW)
          echo "::add-mask::$P"; echo "::add-mask::$S"
          echo "PROD_URL=postgresql://postgres.${PROD_REF}:${P}@aws-0-us-west-2.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
          echo "STG_URL=postgresql://postgres.${STG_REF}:${S}@aws-0-us-east-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
      - name: O que vai ser aplicado (dry-run)
        run: supabase db push --db-url "$PROD_URL" --dry-run
      - name: Conferir que o staging já tem essas migrations
        run: |
          supabase migration list --db-url "$PROD_URL" > prod.txt
          supabase migration list --db-url "$STG_URL" > staging.txt
          # versões pendentes na produção (coluna LOCAL preenchida, REMOTE vazia)
          awk -F'|' 'NF>=2 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {gsub(/ /,"",$1); print $1}' prod.txt > pending.txt || true
          while read v; do
            [ -z "$v" ] && continue
            if ! grep -qE "^[[:space:]]*$v[[:space:]]*\|[[:space:]]*$v" staging.txt; then
              echo "A migration $v ainda NÃO foi aplicada no staging. Teste no staging primeiro."; exit 1
            fi
          done < pending.txt
      - name: Aplicar na PRODUÇÃO
        run: supabase db push --db-url "$PROD_URL" --yes
