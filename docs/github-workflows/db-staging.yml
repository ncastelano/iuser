# Aplica as migrations novas no banco de STAGING sempre que a branch `staging` recebe uma mudança em supabase/migrations.
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      token da sua conta Supabase (Account → Access Tokens), com permissão de escrita
#   STAGING_PROJECT_REF        referência (20 letras) do projeto Supabase de STAGING
#   STAGING_DB_PASSWORD        senha do banco do projeto de STAGING
name: Banco de staging

on:
  push:
    branches: [staging]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency: db-staging

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Linkar o projeto de STAGING
        run: supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      - name: Aplicar migrations novas
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
